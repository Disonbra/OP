name: Fetch, Patch and Package Shaders 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-archive:
    runs-on: macos-14

    steps:
      # 1. Клонируем ваш текущий репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Скачиваем оригинальные шейдеры OpenMW (исправленный синтаксис)
      - name: Fetch original OpenMW shaders
        run: |
          echo "Cloning official OpenMW shaders..."
          git clone --depth=1 https://github.com openmw_source
          mv openmw_source/files/shaders ./shaders
          rm -rf openmw_source
          echo "Original shaders successfully fetched."

      # 3. Инжектируем исправленный скрипт патчинга под GLES 310 / SPIR-V
      - name: Inject updated patch script
        run: |
          cat << 'EOF' > ./patch_shaders.sh
          #!/bin/bash
          REPO_DIR="$(cd "$(dirname "${BASH_SOURCE}")" && pwd)"
          SHADERS_DIR="${REPO_DIR}/shaders"

          if [ ! -d "$SHADERS_DIR" ]; then
              echo "Error: Directory $SHADERS_DIR not found."
              exit 1
          fi

          echo "=== Patching Shaders for iOS (GLES 310 / SPIR-V) ==="

          # --- Part 1: patchShadersLinking (Specific files) ---
          VERTEX_H="$SHADERS_DIR/lib/core/vertex.h.glsl"
          VERTEX_GLSL="$SHADERS_DIR/lib/core/vertex.glsl"
          if [ -f "$VERTEX_H" ] && ! grep -q "#pragma CONVERTED" "$VERTEX_H"; then
              echo "  - Patching vertex.h.glsl"
              content=$(cat "$VERTEX_GLSL")
              content=$(echo "$content" | perl -pe 's/#version 120/vec4 modelToView(vec4 pos);/')
              content=$(echo "$content" | perl -pe 's/uniform vec2 screenRes;/ \/\/uniform vec2 screenRes;/')
              content=$(echo "$content" | perl -pe 's|lib/core/vertex.h.glsl"|lib/core/lighting_vertex_impl.glsl"\n#include "lib/material/struct.glsl"|g')
              printf "%s\n#pragma CONVERTED\n" "$content" > "$VERTEX_H"
          fi

          FRAGMENT_H="$SHADERS_DIR/lib/core/fragment.h.glsl"
          FRAGMENT_GLSL="$SHADERS_DIR/lib/core/fragment.glsl"
          if [ -f "$FRAGMENT_H" ] && ! grep -q "#pragma CONVERTED" "$FRAGMENT_H"; then
              echo "  - Patching fragment.h.glsl"
              content=$(cat "$FRAGMENT_GLSL")
              content=$(echo "$content" | perl -pe 's/#version 120//')
              content=$(echo "$content" | perl -pe 's|lib/core/fragment.h.glsl"|lib/core/lighting_fragment_impl.glsl"\n#include "lib/material/struct.glsl"|g')
              printf "%s\n#pragma CONVERTED\n" "$content" > "$FRAGMENT_H"
          fi

          # Массовые точечные исправления совместимости
          for f in objects.frag terrain.frag water.frag; do
              [ -f "$SHADERS_DIR/compatibility/$f" ] && perl -i -pe 's/uniform float near;/ \/\/uniform float near;/g' "$SHADERS_DIR/compatibility/$f"
          done
          for f in objects.frag objects.vert terrain.frag groundcover.frag water.frag; do
              [ -f "$SHADERS_DIR/compatibility/$f" ] && perl -i -pe 's/uniform vec2 screenRes;/ \/\/uniform vec2 screenRes;/g' "$SHADERS_DIR/compatibility/$f"
          done
          [ -f "$SHADERS_DIR/compatibility/water.frag" ] && perl -i -pe 's/uniform DirectionalLight sun;/ \/\/uniform DirectionalLight sun;/g' "$SHADERS_DIR/compatibility/water.frag"
          [ -f "$SHADERS_DIR/compatibility/groundcover.vert" ] && perl -i -0777 -pe 's|#include "lib/light/clamp.glsl"\n#include|#include|g' "$SHADERS_DIR/compatibility/groundcover.vert"
          [ -f "$SHADERS_DIR/lib/light/util.glsl" ] && perl -i -pe 's/\* int\(gridSize.z\)\) \//\* gridSize.z) \//g' "$SHADERS_DIR/lib/light/util.glsl"
          [ -f "$SHADERS_DIR/compatibility/fog.glsl" ] && perl -i -pe 's/#include/\/\//g' "$SHADERS_DIR/compatibility/fog.glsl"

          # --- Part 2: patchShadersToGLES (All files, including GUI) ---
          find "$SHADERS_DIR" -type f \( -name "*.vert" -o -name "*.frag" -o -name "*.comp" -o -name "*.glsl" \) | while read -r file; do
              if grep -q "#pragma GLES" "$file"; then
                  continue
              fi

              # Очищаем старые директивы версий и пустые строки перед ними
              perl -i -0777 -pe 's/^(\s*(\/\/.*|\/\*[\s\S]*?\*\/)?\s*)*#version\s+\d+(\s+es)?\s*\n//g' "$file"
              
              # Записываем #version 310 es строго на ПЕРВУЮ строчку
              HEADER="#version 310 es\nprecision highp float;\nprecision highp int;\n\n//HEADER_END\n"
              perl -i -0777 -pe "print \"$HEADER\" if \$. == 1; " "$file"

              # Замены для встроенных переменных
              perl -i -pe 's/#extension/\/\/extension/g' "$file"
              perl -i -pe 's/gl_/osg_/g' "$file"
              perl -i -pe 's/osg_Position/gl_Position/g' "$file"
              perl -i -pe 's/osg_FragCoord/gl_FragCoord/g' "$file"
              perl -i -pe 's/osg_ClipDistance/gl_ClipDistance/g' "$file"
              perl -i -pe 's/osg_CullDistance/gl_CullDistance/g' "$file"
              perl -i -pe 's/uniform bool useAdvancedShader = false;/uniform bool useAdvancedShader;/g' "$file"
              perl -i -pe 's/uniform vec2 scaling = vec2\(1.0, 1.0\);/uniform vec2 scaling;/g' "$file"
              perl -i -pe 's/uniform bool useDiffuseMapForShadowAlpha = true;/uniform bool useDiffuseMapForShadowAlpha;/g' "$file"
              perl -i -pe 's/uniform bool alphaTestShadows = true;/uniform bool alphaTestShadows;/g' "$file"

              ext="${file##*.}"
              filename=$(basename "$file")

              if [ "$ext" = "frag" ]; then
                  perl -i -pe 's|\/\/HEADER_END\n|uniform mat4 osg_ModelViewMatrix;\nuniform mat3 osg_NormalMatrix;\n\/\/HEADER_END\n|g' "$file"
                  perl -i -pe 's/osg_ModelViewMatrixInverse/inverse(osg_ModelViewMatrix)/g' "$file"
                  perl -i -pe 's|\/\/HEADER_END\n|layout(location = 0) out vec4 Color0;\nlayout(location = 1) out vec4 Color1;\n\/\/HEADER_END\n|g' "$file"
                  perl -i -pe 's/osg_FragData\[0\]/Color0/g' "$file"
                  perl -i -pe 's/osg_FragData\[1\]/Color1/g' "$file"
                  perl -i -pe 's/osg_FragColor/Color0/g' "$file"
                  
                  header_add="#define texture2D texture\n#define textureSize2D textureSize\n#define varying in\n#define shadow2DProj custom_shadow2DProj\n"
                  perl -i -pe "s|\/\/HEADER_END\n|$header_add\/\/HEADER_END\n|g" "$file"
              elif [ "$ext" = "vert" ]; then
                  perl -i -pe 's/#version 310 es\n/#version 310 es\n#extension GL_EXT_clip_cull_distance : enable\n/g' "$file"
                  perl -i -pe 's/osg_ClipVertex = viewPos;//g' "$file"
                  [[ "$filename" == *"terrain_composite"* ]] && perl -i -pe 's/osg_ModelViewMatrix \* //g' "$file"
                  [[ "$filename" == *"shadowcasting"* ]] && perl -i -pe 's/    vec4 viewPos/#if !defined(USE_DEPTH_CLAMP)\n    gl_Position.z = max(gl_Position.z, -gl_Position.w);\n#endif\n    vec4 viewPos/g' "$file"
              fi
              echo "#pragma GLES" >> "$file"
          done
          echo "=== Patching Completed Successfully ==="
          EOF
          chmod +x ./patch_shaders.sh

      # 4. Запускаем пропатченный скрипт
      - name: Run shader patching script
        run: ./patch_shaders.sh

      # 5. Упаковываем готовую папку shaders в ZIP-архив
      - name: Create ZIP archive
        run: |
          zip -r patched_shaders.zip shaders

      # 6. Выгружаем готовый ZIP-архив в артефакты GitHub Actions
      - name: Upload Patched Shaders Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-shaders-ios26.2
          path: patched_shaders.zip
          retention-days: 7
